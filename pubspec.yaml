name: pypath
description: A self-paced Python learning app for mobile.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  llama_flutter_android: ^0.2.6
  path_provider: ^2.1.5
  crypto: ^3.0.6
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/easy-python-wordmark.png
    - assets/content/en/python-v1.json
    - assets/prompts/
    - assets/pyodide/worker.html
    - assets/pyodide/runner_worker.js
    - assets/pyodide/0.27.8/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
